name: publicar Imagen en Docker Hub

on:
  push:
    branches: ["main", "feature/vulnerabilidades"]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: configurar python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -s B101 -x ./tempdir

      - name: ejecutar pruebas
        run: pytest

  build-and-deploy:

    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Iniciar sesión en docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: construir 
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: danieluque/mi-api:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: danieluque/mi-api:latest
          format: 'table'
          exit-code: '1' # si encuentra falla,rompe la ejecucion
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' #son los que van a detener la ejecucion

      - name: subir la imagen a docker hub
        run: docker push danieluque/mi-api:latest

      - name: desplegar en el servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/DockerFlaskDesplegado
            docker compose pull backend
            docker compose up -d --force-recreate