services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80" #Http
      - "81:81" #Administración de la API
      - "443:443" #Https
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - red-ejemplo

  db:
    image: mysql:8.0
    container_name: servidor-bd-082
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-ejemplo
    health-check:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: .
    container_name: backend-082
    depends_on:
      - db
        
    condition: healthy
    health-check:
      test: ["CMD-SHELL", "curl", "-f", "http://localhost:5050/ || localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - red-ejemplo

volumes:
  mysql-data:

networks:
  red-ejemplo:
    driver: bridge